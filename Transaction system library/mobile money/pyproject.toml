[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobimoney"
version = "0.1.0"
description = "A Python library simulating mobile money (MoMo) transactions: deposit, withdraw, send, receive, with tiered fees and levy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kelvin Owusu Darteh" }
]
keywords = ["mobile money", "momo", "fintech", "ghana", "simulation", "wallet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["mobimoney*"]
